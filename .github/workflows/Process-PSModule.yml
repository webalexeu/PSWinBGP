name: Process-PSModule

run-name: "Process-PSModule - [${{ github.event.pull_request.title }} #${{ github.event.pull_request.number }}] by @${{ github.actor }}"

on:
  pull_request:
    branches:
      - main
    types:
      - closed
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

jobs:
  Process-PSModule:
    uses: PSModule/Process-PSModule/.github/workflows/workflow.yml@2471b535b3827de0271ed7e93d49427c17e452fc # v8.0.10
    secrets:
      PSGALLERY_API_KEY: ${{ secrets.APIKEY }}
      GitHubAppClientId: ${{ secrets.GH_APP_CLIENT_ID }}
      GitHubAppPrivateKey: ${{ secrets.GH_APP_PRIVATE_KEY }}
